name: Queue engine tests

on:
  push:
    branches:
      - "rebuild/**"
  pull_request:
  workflow_dispatch:

jobs:
  queue-tests:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test queue lifecycle
        run: python test_queue_engine.py
